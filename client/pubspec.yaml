name: client
description: "Kisan Saathi - Farmer One Stop Solution"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation
  go_router: ^14.8.1
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Network
  http: ^1.3.0
  dio: ^5.8.0+1
  # Image & Camera
  image_picker: ^1.1.2
  # Storage
  shared_preferences: ^2.5.2
  # UI
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  # Localization (Hindi + English)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # File handling
  path_provider: ^2.1.5
  mime: ^2.0.0
  # Open buy links in browser
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/onboarding/
  generate: true
